name: servicehub-cordova

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    # Always rebuild this short-lived image before it is run. This prevents a
    # manual `docker compose run migrate` from using an older migration set.
    pull_policy: build
    env_file:
      - .env
    environment:
      # Compose interpolation reads this value from SERVICEHUB-BACKEND/.env.
      # Keeping it explicit also allows a one-off shell override during a
      # read-only clean-machine verification.
      DIRECT_URL: ${DIRECT_URL:-}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ../SERVICEHUB-FRONTEND
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
