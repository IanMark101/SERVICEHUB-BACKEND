name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Docs/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ fromJSON(secrets.SERVICEHUBSECRETKEY).DOCKERHUB_USERNAME }}
          password: ${{ fromJSON(secrets.SERVICEHUBSECRETKEY).DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ fromJSON(secrets.SERVICEHUBSECRETKEY).DOCKERHUB_USERNAME }}/servicehub-backend

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy Docker Compose & Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ fromJSON(secrets.SERVICEHUBSECRETKEY).SSH_HOST }}
          username: ${{ fromJSON(secrets.SERVICEHUBSECRETKEY).SSH_USER }}
          key: ${{ secrets.SERVICEHUB_DEPLOY_SSH_KEY || fromJSON(secrets.SERVICEHUBSECRETKEY).SSH_PRIVATE_KEY }}
          source: 'docker/docker-compose.yaml,scripts/deploy.sh'
          target: '/root'

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ fromJSON(secrets.SERVICEHUBSECRETKEY).SSH_HOST }}
          username: ${{ fromJSON(secrets.SERVICEHUBSECRETKEY).SSH_USER }}
          key: ${{ secrets.SERVICEHUB_DEPLOY_SSH_KEY || fromJSON(secrets.SERVICEHUBSECRETKEY).SSH_PRIVATE_KEY }}
          script: sh /root/scripts/deploy.sh
