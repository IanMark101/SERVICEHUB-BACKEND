name: servicehub-backend

services:
  migrate:
    image: ianmark123/servicehub-backend:migrator
    env_file:
      - /root/env/servicehub-backend/.env
    environment:
      NODE_ENV: production
    profiles: ["migration"]
    restart: "no"

  app:
    image: ianmark123/servicehub-backend
    ports:
       - "127.0.0.1:8000:8000"
    env_file:
      - /root/env/servicehub-backend/.env
    environment:
      NODE_ENV: production
      PORT: "8000"
    restart: unless-stopped
